          facilitates the use of a few different radio wave propagation models.
        fr: >-
          crc-covlib est une API (interface de programmation) facilitant l'usage
          de différents modèles de propagation des ondes radio.
      howItWorks:
        en: >-
          crc-covlib can be used from the C++ and python programming languages
          to generate coverage or interference predictions.
        fr: >-
          crc-covlib peut être utilisée à partir des langages de programmation
          C++ et python afin de générer des prédictions de couverture et
          d'interférence.
